aid: lifesite
name: LifeSite
description: >-
  LifeSite is a data protection and digital asset company that helps
  organizations safeguard sensitive information, simplify compliance, and
  digitally verify ownership. Its Vault product is an encrypted store for
  personally identifiable, financial, and health information used by both
  enterprises and families to organize and collaborate on vital documents.
  TokenX, its Web3 arm, tokenizes real-world assets — critical minerals, carbon
  credits, and sports and consumer goods — so provenance and ownership can be
  authenticated without blockchain expertise. A Wellness product covers health,
  testing, and vaccination tracking for enterprises and events, and a Platform
  offering exposes LifeSite's building blocks and APIs for partners building
  tailored data-management applications. LifeSite is sales-led: the Platform
  APIs are described publicly but no developer portal, API reference, or
  specification is published, and access is arranged through a demo request.
